# Unsigned build on every push to main: package tests + an unsigned device IPA (artifact, 7 days)
# that iloader can sign. No secrets anywhere in this workflow.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Package tests
        run: scripts/ci-test.sh
      - name: Unsigned device build
        run: scripts/ci-build-unsigned.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nexline-voice-unsigned-ipa
          path: build/NexlineVoice-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      # Raw logs need a token; annotations don't. On failure, surface the last log lines.
      - name: Log tails
        if: failure()
        run: |
          for f in build/*.log; do
            [ -f "$f" ] || continue
            tail -n 4 "$f" | sed -e 's/%/%25/g' -e "s#^#::error title=$(basename "$f")::#"
          done
